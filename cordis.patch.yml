# dsh-session-history bundle patch：两个插入行。
# 一行是本包的 Host 插件（导入导出任务与路由），一行是导入会话专用的 Agent 预设。
# 预设只带 persona、压缩组与联网搜索工具，不装文件与终端工具：导入的是聊天记录，不是编码任务。
- insert:
    - id: dsh-session-history
      name: 'dsh-session-history'
      config: {}
    - id: preset-dsh-session-history
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-session-history
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a helpful assistant continuing an imported conversation. Reply in the language the conversation uses.
              complete: true
              includeRuntimeContext: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
